name: Founder Portrait Cutout QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-founder-cutout-20261020.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portrait subject separation tools
        run: python -m pip install 'rembg[cpu]' pillow numpy
      - name: Separate verified Robert portrait from office, preserve his face
        run: python scripts/qa_founder_cutout_20261020.py
      - name: Commit QA candidate outside published docs, without changing website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/visual-review/robert-founder-cutout-reviewed.webp qa/visual-review/robert-mask-qa.png
          git commit -m 'Visual QA: check Robert cutout before publishing'
          git pull --rebase origin main
          git push origin HEAD:main
