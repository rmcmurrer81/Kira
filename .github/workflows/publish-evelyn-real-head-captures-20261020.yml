name: Publish authentic Evelyn head screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-evelyn-real-head-captures-20261020.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image verification package
        run: python -m pip install pillow
      - name: Download and crop original renderer captures without generative edits
        run: python scripts/publish_evelyn_recorded_views_20261020.py
      - name: Verify exactly three views and source screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('docs/assets')
          for label in ('front','three-quarter','side'):
              p=root/f'evelyn-head-{label}-capture-20261020.webp'
              raw=root/f'evelyn-head-{label}-source-20261020.jpg'
              with Image.open(p) as im:
                  assert im.size==(820,830)
                  im.verify()
              with Image.open(raw) as im:
                  assert im.size==(1536,1536)
                  im.verify()
          print('All 3 actual rendering views and their source copies are valid')
          PY
      - name: Commit public research imagery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/evelyn-head-*-20261020.webp docs/assets/evelyn-head-*-20261020.jpg
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Evelyn 3-angle compatibility head captures from recorded screenshots'
          git pull --rebase origin main
          git push origin HEAD:main
