name: Byte and Bolt voice compatibility QA
on:
  push:
    paths:
      - 'docs/arcade/byte-bolt/**'
      - 'scripts/test_byte_bolt_audio_browser.py'
      - '.github/workflows/byte-bolt-audio-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render prerecorded Sarah audio if not yet packaged
        if: hashFiles('docs/arcade/byte-bolt/audio/narrator/*.mp3') == ''
        env:
          ORT_DISABLE_TELEMETRY: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install kokoro-onnx==0.6.1
          curl --fail --location --retry 2 -o /tmp/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl --fail --location --retry 2 -o /tmp/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python scripts/build_byte_bolt_audio.py --model /tmp/kokoro.onnx --voices /tmp/voices.bin --workers 2
      - name: Preserve generated speech on the isolated QA branch
        if: startsWith(github.ref, 'refs/heads/fix/byte-bolt-')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arcade/byte-bolt/audio/narrator docs/arcade/byte-bolt/audio-bundled-map.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render bundled Sarah dialogue for voice compatibility checks'
          git push origin HEAD:${{ github.ref_name }}
      - name: Verify all game logic, clip coverage, interruptions and render pause
        run: node --test docs/arcade/byte-bolt/tests/test-original.cjs docs/arcade/byte-bolt/tests/test-campaign.cjs docs/arcade/byte-bolt/tests/test-scene.cjs docs/arcade/byte-bolt/tests/test-audio.cjs
      - name: Prepare isolated Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Verify real media playback without GPU or installed system voices
        run: python scripts/test_byte_bolt_audio_browser.py
      - name: Rebuild and verify playable source ZIP
        run: python scripts/package_byte_bolt.py
      - name: Save matching source ZIP on the voice-fix branch
        if: startsWith(github.ref, 'refs/heads/fix/byte-bolt-')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arcade/byte-bolt/audio/narrator docs/arcade/byte-bolt/audio-bundled-map.js docs/arcade/byte-bolt/Byte-and-Bolt-Prototype.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Package verified Byte and Bolt audio fix for offline play'
          git push origin HEAD:${{ github.ref_name }}
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byte-bolt-voice-check
          path: /tmp/byte-bolt-sound-*.png
          if-no-files-found: ignore
