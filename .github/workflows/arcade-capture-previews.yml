name: Capture authentic Kira Labs Arcade game previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_arcade_previews_20261106.py'
      - '.github/workflows/arcade-capture-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture-game-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Chromium and image tools
        run: |
          python -m pip install playwright pillow
          python -m playwright install chromium --with-deps
      - name: Capture actual game scenes locally
        run: |
          python -m http.server 8765 --directory docs >/tmp/arcade-server.log 2>&1 &
          sleep 3
          python scripts/capture_arcade_previews_20261106.py
      - name: Commit only actual game scene thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arcade/previews/*-real-gameplay-20261106.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Arcade: capture verified real game-scene thumbnails'
          git pull --rebase origin main
          git push origin HEAD:main
