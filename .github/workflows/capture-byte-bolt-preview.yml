name: Capture Byte and Bolt authentic Arcade preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_byte_bolt_preview.py'
      - '.github/workflows/capture-byte-bolt-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture-byte-bolt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare browser and image tools
        run: |
          python -m pip install playwright pillow
          python -m playwright install chromium --with-deps
      - name: Capture an actual game scene
        run: |
          python -m http.server 8765 --directory docs >/tmp/byte-bolt-server.log 2>&1 &
          sleep 3
          python scripts/capture_byte_bolt_preview.py
      - name: Commit verified real scene only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arcade/previews/byte-bolt-real-gameplay-20261107.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Arcade: add authentic Byte & Bolt game screenshot'
          git pull --rebase origin main
          git push origin HEAD:main
