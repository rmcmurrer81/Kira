name: Kira Labs arcade QA
on:
  push:
    paths:
      - "docs/arcade/**"
      - "docs/index.html"
      - "docs/labs.js"
      - "docs/tools-apps.html"
      - "docs/sitemap.xml"
      - "tests/test-arcade.cjs"
      - "tests/test-arcade-voice-animation.cjs"
      - ".github/workflows/arcade-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify independent arcade edition and original tutorial
        run: node tests/test-arcade.cjs && node tests/test-arcade-voice-animation.cjs
