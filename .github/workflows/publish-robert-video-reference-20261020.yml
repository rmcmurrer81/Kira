name: Publish Robert video-reference About portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-robert-video-reference-20261020.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image verification
        run: python -m pip install pillow
      - name: Update About page from previously approved video frames
        run: python scripts/publish_robert_video_reference_20261020.py
      - name: Validate image and About references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('docs/assets/robert-video-photoalbum-cinematic-20261020.webp')
          with Image.open(p) as im:
            assert im.width>=1600 and im.height>=850
            im.verify()
          html=Path('docs/about.html').read_text(encoding='utf8')
          assert 'robert-video-photoalbum-cinematic-20261020.webp?v=1' in html
          assert 'photo-album video frames' in html
          assert 'assets/about-turned-video-portrait.webp' not in html
          print('Verified replaced About page portrait')
          PY
      - name: Publish image and page references to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/about.html docs/assets/robert-video-photoalbum-cinematic-20261020.webp
          git diff --cached --stat
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Publish About portrait based on saved Robert video frames'
          git pull --rebase origin main
          git push origin HEAD:main
