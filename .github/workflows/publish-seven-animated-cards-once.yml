name: Publish Kira Labs seven animated cards once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-seven-animated-cards-once.yml

permissions:
  contents: write
  pages: write

jobs:
  install-gifs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current website branch
        run: git pull --ff-only origin main
      - name: Download and validate seven user-approved GIF animations
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            "https://at.adobe.com/qm8Jt1aJOdL5Mtxk" -o /tmp/kiralabs-animated-cards.zip
          unzip -tqq /tmp/kiralabs-animated-cards.zip
          mkdir -p docs/assets/animations
          unzip -j -o -qq /tmp/kiralabs-animated-cards.zip "animated-cards/*.gif" -d docs/assets/animations
          python3 scripts/install_kiralabs_animated_cards_20261105.py
      - name: Verify prohibited artwork stays excluded and contact privacy stays intact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_rejected_public_media.py
          node tests/test-public-google-voice-contact-20261027.cjs
      - name: Publish approved card-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-seven-animated-cards-once.yml
          git add docs/index.html docs/projects.html docs/kira-world.html docs/concept-animations.css docs/assets/animations/
          git commit -m "Animate seven existing Kira Labs project cards with still-image fallbacks"
          git push origin HEAD:main
      - name: Request public GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/\${GITHUB_REPOSITORY}/pages/builds"
