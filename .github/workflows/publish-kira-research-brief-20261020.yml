name: Publish Kira Labs current research briefing PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-kira-research-brief-20261020.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report production libraries
        run: python -m pip install reportlab pillow pypdf pypdfium2
      - name: Produce public briefing with evidence and actual head images
        run: python scripts/build_oct20_public_research_brief.py
      - name: Verify PDF text, page count and evidence names
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('docs/reports/kira-labs-research-evidence-2026-10-20.pdf')
          r=PdfReader(str(p))
          txt=' '.join(page.extract_text() or '' for page in r.pages)
          assert 3 <= len(r.pages) <= 5,len(r.pages)
          for piece in ['11,914','2/12','2/5','Three visible head views','BlackProject','512 weighted skin']:
              assert piece in txt,piece
          print('Public PDF verified',len(r.pages),'pages',p.stat().st_size,'bytes')
          PY
      - name: Render PDF for genuine visual inspection
        run: |
          mkdir -p qa/reports
          python - <<'PY'
          from pathlib import Path
          import pypdfium2 as pdfium
          d=pdfium.PdfDocument('docs/reports/kira-labs-research-evidence-2026-10-20.pdf')
          assert len(d)>=3
          for i in range(min(3,len(d))):
              im=d[i].render(scale=1.5).to_pil()
              p=Path(f'qa/reports/kira-labs-evidence-2026-10-20-{i+1}.jpg')
              im.convert('RGB').save(p,'JPEG',quality=87)
              assert p.stat().st_size>18000, (p,p.stat().st_size)
              print('Rendered verified report page',i+1,im.size,p.stat().st_size)
          PY
      - name: Save public report and review captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports/kira-labs-research-evidence-2026-10-20.pdf qa/reports/kira-labs-evidence-2026-10-20-*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish October 20 evidence PDF with real Evelyn head view screenshots'
          git pull --rebase origin main
          git push origin HEAD:main
