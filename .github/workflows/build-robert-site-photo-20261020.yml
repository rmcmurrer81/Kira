name: Finish Kira Labs About likeness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-robert-site-photo-20261020.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: python -m pip install pillow
      - name: Assemble Robert's approved portrait with waterfront skyline
        run: python scripts/build_robert_founder_reference_20261020.py
      - name: Reference the REAL site asset instead of the office or blank skyline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/about.html')
          html=p.read_text(encoding='utf-8')
          old='assets/robert-mcmurrer-portrait.webp'
          assert html.count(old)>=1,html.count(old)
          html=html.replace(old,'assets/robert-founder-skyline-real-likeness-20261020.webp')
          html=html.replace('Approved likeness · AI-assisted portrait','Founder portrait · cinematic composite')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Check source file and real page reference
        run: |
          python - <<'PY'
          from PIL import Image,ImageStat
          from pathlib import Path
          p=Path('docs/assets/robert-founder-skyline-real-likeness-20261020.webp')
          im=Image.open(p).convert('RGB')
          assert im.size==(1920,690)
          c=im.crop((1190,95,1600,505))
          assert sum(ImageStat.Stat(c).stddev)>75,ImageStat.Stat(c).stddev
          assert p.name in Path('docs/about.html').read_text(encoding='utf8')
          print('Site founder asset verified:',im.size,p.stat().st_size)
          PY
      - name: Publish portrait and associated HTML to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/about.html docs/assets/robert-founder-skyline-real-likeness-20261020.webp
          git commit -m 'Display Robert approved likeness in cinematic About hero'
          git push origin HEAD:main
