name: Kira Labs Timeline Journey QA
on:
  push:
    branches: [main]
    paths:
      - "docs/progress.html"
      - "docs/labs-timeline.js"
      - "docs/timeline-redesign-20261106.css"
      - "docs/labs-data.js"
      - "scripts/test_timeline_journey.py"
      - ".github/workflows/timeline-journey-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check timeline script syntax
        run: node --check docs/labs-timeline.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Test real timeline interaction and accessible motion
        run: |
          python -m http.server 8765 --directory docs >/tmp/kira-timeline-server.log 2>&1 &
          sleep 3
          python scripts/test_timeline_journey.py
