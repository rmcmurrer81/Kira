<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Three-channel conversation design — isolated software checks only"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1a30"/><stop offset=".52" stop-color="#152d47"/><stop offset="1" stop-color="#15132d"/></linearGradient><linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5ce0e7"/><stop offset="1" stop-color="#a586fa"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="25"/></filter><pattern id="grid" width="66" height="66" patternUnits="userSpaceOnUse"><path d="M66 0H0V66" fill="none" stroke="#7ec7dc" stroke-opacity=".075"/></pattern></defs><rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="1310" cy="150" r="180" fill="#4dbbd2" opacity=".075" filter="url(#g)"/><circle cx="210" cy="790" r="250" fill="#b38bfa" opacity=".075" filter="url(#g)"/>
<text x="92" y="105" font-family="Arial,Helvetica,sans-serif" font-size="44" fill="#d9f9ff" font-weight="750" letter-spacing="3">CONVERSATION CHANNELS</text>
<text x="92" y="149" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#a8cedf" >Different outputs. Different privacy boundaries.</text>
<rect x="95" y="235" width="435" height="168" rx="25" fill="#0f263d" stroke="#66dae8" stroke-opacity=".6" stroke-width="3"/><text x="123" y="292" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#e9fcff" font-weight="700">SPOKEN</text><text x="123" y="338" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#b6d1e1" >Dialogue intended for listeners</text>
<rect x="95" y="453" width="435" height="168" rx="25" fill="#0f263d" stroke="#b697f9" stroke-opacity=".6" stroke-width="3"/><text x="123" y="510" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#e9fcff" font-weight="700">PRIVATE</text><text x="123" y="556" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#b6d1e1" >Internal character reflection</text>
<rect x="95" y="671" width="435" height="145" rx="25" fill="#0f263d" stroke="#efc27d" stroke-opacity=".6" stroke-width="3"/><text x="123" y="728" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#e9fcff" font-weight="700">FACTUAL</text><text x="123" y="774" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#b6d1e1" >Source-grounded claims</text>
<g fill="none" stroke-width="7" stroke-linecap="round"><path d="M554 313H905" stroke="#60dce5"/><path d="M554 535H905" stroke="#aa94f8"/><path d="M554 733H905" stroke="#dfbe7c"/></g>
<g fill="#ccf7fc"><path d="M904 299l32 14-32 14z"/><path d="M904 521l32 14-32 14z"/><path d="M904 719l32 14-32 14z"/></g>
<rect x="970" y="250" width="525" height="466" rx="30" fill="#101f34" stroke="#68d2e1" stroke-opacity=".55" stroke-width="4"/>
<text x="1232" y="360" font-family="Arial,Helvetica,sans-serif" font-size="51" fill="#f0fcff" text-anchor="middle" font-weight="740">SEPARATE</text>
<text x="1232" y="424" font-family="Arial,Helvetica,sans-serif" font-size="51" fill="#8af0f4" text-anchor="middle" font-weight="740">HANDLING</text>
<text x="1232" y="514" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#c3d7e5" text-anchor="middle">Scoped checks test separation</text>
<text x="1232" y="555" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#c3d7e5" text-anchor="middle">and safeguards, not real voice</text>
<text x="1232" y="596" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#c3d7e5" text-anchor="middle">or persistent conversation.</text></svg>