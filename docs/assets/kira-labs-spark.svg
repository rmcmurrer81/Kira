<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Kira Labs spark mark</title>
  <desc id="desc">A glowing four-point spark in cyan and violet.</desc>
  <defs>
    <linearGradient id="g" x1="12" y1="18" x2="115" y2="109" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54d7ff"/>
