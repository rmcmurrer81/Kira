<path d="M1250 545v66H543v-66" stroke="#8fd4e4" stroke-width="2.5" stroke-dasharray="9 8" fill="none" marker-end="url(#arrow)" opacity=".84"/>
<rect x="683" y="583" width="432" height="54" rx="25" fill="#102438" stroke="#2c6676"/>
<text x="900" y="606" text-anchor="middle" fill="#ddf7fc" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Future response / execution feedback</text>
<text x="900" y="623" text-anchor="middle" fill="#9ab9cd" font-family="Segoe UI,Arial,sans-serif" font-size="12">accepted · rejected · started · completed · interrupted</text>
<rect x="54" y="670" width="1330" height="46" rx="13" fill="#091524" stroke="#355164"/>
<text x="75" y="698" fill="#ced7e3" font-family="Segoe UI,Arial,sans-serif" font-size="16">Documented: 88 standalone local checks (Aug 2026). No live NewBrain link, authenticated robot session, or hardware control.</text>
</svg>