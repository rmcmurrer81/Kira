<!-- tile text -->
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="76" y="239" fill="#8beaf0" font-size="13" letter-spacing="1.5" font-weight="700">01  /  RESEARCH LAYER</text>
 <text x="424" y="239" fill="#c3b6ff" font-size="13" letter-spacing="1.5" font-weight="700">02  /  IDENTITY &amp; CONTEXT</text>
 <text x="772" y="239" fill="#85e9d8" font-size="13" letter-spacing="1.5" font-weight="700">03  /  REQUEST GATE</text>
 <text x="1120" y="239" fill="#d9c0ff" font-size="13" letter-spacing="1.5" font-weight="700">04  /  PHYSICAL ENDPOINT</text>
 <text x="76" y="411" fill="#f3fbff" font-weight="750" font-size="29">NewBrain</text>
 <text x="424" y="411" fill="#f3fbff" font-weight="750" font-size="29">Kira World</text>
 <text x="772" y="411" fill="#f3fbff" font-weight="750" font-size="27">Bounded ROS 2</text>
 <text x="1120" y="411" fill="#f3fbff" font-weight="750" font-size="26">Companion robot</text>
 <g fill="#bfccda" font-size="17">
  <text x="76" y="445">Learning and memory</text><text x="76" y="469">experiments; not connected</text>
  <text x="424" y="445">Separate identity, context,</text><text x="424" y="469">memories, intentions</text>
  <text x="772" y="445">Speech, gaze, expression,</text><text x="772" y="469">gesture policy checks</text>
  <text x="1120" y="445">Future simulator/robot</text><text x="1120" y="469">executes within safe limits</text>
 </g>
 <g fill="#132536">
  <rect x="72" y="484" width="157" height="27" rx="13.5" fill="#23364a"/><rect x="420" y="484" width="166" height="27" rx="13.5" fill="#2e2c4a"/><rect x="768" y="484" width="183" height="27" rx="13.5" fill="#1b484a"/><rect x="1116" y="484" width="181" height="27" rx="13.5" fill="#39314c"/>
 </g>
 <g font-size="12" font-weight="700" letter-spacing=".5">
  <text x="86" y="502" fill="#b5e9ef">NOT CONNECTED</text>
  <text x="435" y="502" fill="#d3c5ff">ACTIVE PROTOTYPES</text>
  <text x="783" y="502" fill="#b7f3d9">LOCAL TESTS REPORTED</text>
  <text x="1131" y="502" fill="#dfc9ff">NOT CONNECTED</text>
 </g>
</g>
