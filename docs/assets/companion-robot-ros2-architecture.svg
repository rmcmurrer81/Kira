<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title description">
<title id="title">Kira Labs proposed NewBrain to companion robot architecture</title>
<desc id="description">Concept only. Experimental NewBrain could contribute learning to Kira World. Kira World would select bounded social intentions, which a ROS 2 policy bridge would validate and submit to a future simulator or companion robot. Execution status would be returned. No live connected robot or NewBrain integration is demonstrated.</desc>
<defs>
 <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2d"/><stop offset=".54" stop-color="#0d1226"/><stop offset="1" stop-color="#16142a"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#39d8e9" stop-opacity=".25"/><stop offset="1" stop-color="#39d8e9" stop-opacity="0"/></radialGradient>
 <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a3d"/><stop offset=".6" stop-color="#101c31"/><stop offset="1" stop-color="#161b34"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55e0e9"/><stop offset="1" stop-color="#b7a0fa"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00030d" flood-opacity=".45"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#71deeb"/></marker>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#98c7eb" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1440" height="740" rx="30" fill="url(#ground)"/>
<rect width="1440" height="740" rx="30" fill="url(#grid)"/>
<ellipse cx="400" cy="240" rx="520" ry="300" fill="url(#glow)"/>
<ellipse cx="1170" cy="530" rx="340" ry="340" fill="url(#glow)" opacity=".65"/>
<path d="M64 54H142" stroke="#77e8ef" stroke-width="3" stroke-linecap="round"/>
<text x="155" y="61" fill="#9fe6f1" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" letter-spacing="2.5">KIRA LABS  /  FUTURE EMBODIMENT RESEARCH</text>
<text x="1364" y="60" text-anchor="end" fill="#ffc977" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">PROPOSED • NOT CONNECTED</text>
<text x="68" y="123" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="750">One continuing identity. A future companion robot.</text>
<text x="70" y="157" fill="#aec6d6" font-family="Segoe UI,Arial,sans-serif" font-size="19">Four distinct layers — measurable requests, explicit limits, and return status.</text>
<!-- connector pathways -->
<g fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity=".88">
 <path d="M340 350H392" stroke-dasharray="7 9"/>
 <path d="M688 350H740" stroke-dasharray="7 9"/>
 <path d="M1036 350H1088" stroke-dasharray="7 9"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#adcfe5" text-anchor="middle">
 <text x="366" y="326">FUTURE</text>
 <text x="714" y="326">PLANNED</text>
 <text x="1062" y="326">PLANNED</text>
</g>
