 <rect x="1186" y="253" width="103" height="93" rx="31"/><path d="M1237 239v14m-12-15h24m-63 59h-14m117 0h14"/><circle cx="1237" cy="232" r="5" fill="#c8aeff"/>
 <path d="M1209 289h17m24 0h17"/><path d="M1212 317q25 18 49 0"/><path d="M1201 354v12m72-12v12m-92 22q53-42 108 0"/>
</g>
